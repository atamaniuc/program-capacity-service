global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

# Both roles expose /metrics on the internal ops port (container port 9464, never routed).
scrape_configs:
  - job_name: capacity-api
    static_configs:
      - targets: ['api:9464']
        labels: { role: api }
  - job_name: capacity-worker
    static_configs:
      - targets: ['worker:9464']
        labels: { role: worker }
  - job_name: funding-api
    static_configs:
      - targets: ['funding-api:9464']
        labels: { role: api }
  - job_name: funding-worker
    static_configs:
      - targets: ['funding-worker:9464']
        labels: { role: worker }
