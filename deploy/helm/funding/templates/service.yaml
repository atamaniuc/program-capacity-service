apiVersion: v1
kind: Service
metadata:
  name: funding-api
  labels:
    {{- include "funding.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: funding
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
    - name: ops
      port: {{ .Values.ports.ops }}
      targetPort: ops
