apiVersion: apps/v1
kind: Deployment
metadata:
  name: funding-api
  labels:
    {{- include "funding.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: funding
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "funding.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: api
          image: {{ include "funding.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            {{- include "funding.envFrom" . | nindent 12 }}
          env:
            - name: APP_ROLE
              value: api
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.http }}
            - name: ops
              containerPort: {{ .Values.ports.ops }}
          {{- include "funding.probes" . | nindent 10 }}
