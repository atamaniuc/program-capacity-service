# A pre-install hook (weight -10) so the migrate hook Job can read it; replaced on upgrade.
apiVersion: v1
kind: ConfigMap
metadata:
  name: funding-env
  labels:
    {{- include "funding.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '-10'
    helm.sh/hook-delete-policy: before-hook-creation
data:
  KAFKA_BROKERS: {{ .Values.kafkaBrokers | quote }}
  OAUTH_ISSUER: {{ .Values.oauth.issuer | quote }}
  OAUTH_AUDIENCE: {{ .Values.oauth.audience | quote }}
  OAUTH_JWKS_URL: {{ .Values.oauth.jwksUrl | quote }}
  OAUTH_TOKEN_URL: {{ .Values.oauth.tokenUrl | quote }}
  CAPACITY_GRPC_TARGET: {{ .Values.capacityGrpcTarget | quote }}
  PAYMENTS_BASE_URL: {{ .Values.paymentsUrl | quote }}
  HTTP_PORT: {{ .Values.ports.http | quote }}
  OPS_PORT: {{ .Values.ports.ops | quote }}
  FUNDING_GRPC_DEADLINE_MS: {{ .Values.funding.grpcDeadlineMs | quote }}
  FUNDING_PAYMENT_TIMEOUT_MS: {{ .Values.funding.paymentTimeoutMs | quote }}
  FUNDING_STEP_LEASE: {{ .Values.funding.stepLease | quote }}
  FUNDING_RESERVE_DEADLINE: {{ .Values.funding.reserveDeadline | quote }}
  FUNDING_DISBURSE_DEADLINE: {{ .Values.funding.disburseDeadline | quote }}
  FUNDING_RESERVE_RESOLUTION_LIMIT: {{ .Values.funding.reserveResolutionLimit | quote }}
  {{- with .Values.corsOrigins }}
  CORS_ORIGINS: {{ . | quote }}
  {{- end }}
