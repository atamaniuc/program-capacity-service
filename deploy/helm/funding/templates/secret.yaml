{{- if not .Values.database.existingSecret }}
# DATABASE_URL carries a password: local default; production sets database.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: funding-database
  labels:
    {{- include "funding.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '-10'
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
---
# The worker's OAuth2 client secret, apart from DATABASE_URL so database.existingSecret does not
# have to carry it. Only the worker reads it.
apiVersion: v1
kind: Secret
metadata:
  name: funding-oauth-client
  labels:
    {{- include "funding.labels" . | nindent 4 }}
type: Opaque
stringData:
  OAUTH_CLIENT_SECRET: {{ required "funding: set oauth.clientSecret" .Values.oauth.clientSecret | quote }}
