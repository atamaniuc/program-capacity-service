# The api and worker Deployments are created after this hook completes: readiness fails until
# the schema is migrated.
apiVersion: batch/v1
kind: Job
metadata:
  name: capacity-migrate
  labels:
    {{- include "capacity.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '0'
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "capacity.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ toJson .Values.migrate.command }}
          envFrom:
            {{- include "capacity.envFrom" . | nindent 12 }}
