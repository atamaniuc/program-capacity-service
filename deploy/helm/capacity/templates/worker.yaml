apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-worker
  labels:
    {{- include "capacity.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: capacity
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "capacity.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "capacity.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            {{- include "capacity.envFrom" . | nindent 12 }}
          env:
            - name: APP_ROLE
              value: worker
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - name: ops
              containerPort: {{ .Values.ports.ops }}
          {{- include "capacity.probes" . | nindent 10 }}
