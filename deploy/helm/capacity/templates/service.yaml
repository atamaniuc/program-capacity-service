# gRPC (50051) is internal only: ClusterIP, no ingress (ADR 024).
apiVersion: v1
kind: Service
metadata:
  name: capacity-api
  labels:
    {{- include "capacity.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: capacity
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
    - name: grpc
      port: {{ .Values.ports.grpc }}
      targetPort: grpc
    - name: ops
      port: {{ .Values.ports.ops }}
      targetPort: ops
