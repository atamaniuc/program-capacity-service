{{- if not .Values.database.existingSecret }}
# DATABASE_URL carries a password. This Secret is the local default; production sets
# database.existingSecret and creates the Secret from its secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: capacity-database
  labels:
    {{- include "capacity.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '-10'
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
