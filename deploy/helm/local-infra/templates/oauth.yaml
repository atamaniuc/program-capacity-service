apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth-config
  labels:
    {{- include "infra.labels" . | nindent 4 }}
data:
  # Copy of deploy/oauth/config.json; make helm-check fails when the two differ.
  config.json: |
{{ .Files.Get "files/oauth-config.json" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: oauth
  labels:
    {{- include "infra.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: oauth
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth
  labels:
    {{- include "infra.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # A changed token mapping restarts the Pod: the server reads its config only at start.
        checksum/config: {{ .Files.Get "files/oauth-config.json" | sha256sum }}
    spec:
      enableServiceLinks: false
      containers:
        - name: oauth
          image: {{ .Values.oauth.image }}
          env:
            - { name: JSON_CONFIG_PATH, value: /config/config.json }
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /default/.well-known/openid-configuration
              port: http
            periodSeconds: 3
            failureThreshold: 20
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: oauth-config
