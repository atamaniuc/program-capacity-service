apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    {{- include "infra.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: broker
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    {{- include "infra.labels" . | nindent 4 }}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # A Service named kafka would inject KAFKA_PORT, which the image reads as broker config.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          env:
            - { name: KAFKA_NODE_ID, value: '1' }
            - { name: KAFKA_PROCESS_ROLES, value: 'broker,controller' }
            - { name: KAFKA_LISTENERS, value: 'PLAINTEXT://:9092,CONTROLLER://:9093' }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: 'PLAINTEXT://kafka:9092' }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT' }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: '1@localhost:9093' }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: '1' }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: '1' }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: '1' }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: '0' }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: 'false' }
          ports:
            - name: broker
              containerPort: 9092
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 20
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
      volumes:
        - name: data
          emptyDir: {}
---
# Creates the topics once the broker is ready (post-install hook; --wait waits for the Job).
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  labels:
    {{- include "infra.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 10
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: topics
          image: {{ .Values.kafka.image }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              for name in {{ join " " .Values.kafka.topics }}; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
                  --topic "$name" --partitions {{ .Values.kafka.partitions }} --replication-factor 1
              done
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
