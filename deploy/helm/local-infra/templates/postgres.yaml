apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  labels:
    {{- include "infra.labels" . | nindent 4 }}
data:
  init.sh: |
    #!/bin/bash
    set -euo pipefail
    {{- range .Values.postgres.databases }}
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<'SQL'
    CREATE ROLE {{ .role }} LOGIN PASSWORD '{{ .password }}';
    CREATE DATABASE {{ .name }} OWNER {{ .role }};
    REVOKE CONNECT ON DATABASE {{ .name }} FROM PUBLIC;
    GRANT CONNECT ON DATABASE {{ .name }} TO {{ .role }};
    SQL
    {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-admin
  labels:
    {{- include "infra.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.adminPassword | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "infra.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "infra.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
          envFrom:
            - secretRef:
                name: postgres-admin
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ['pg_isready', '-U', 'postgres']
            periodSeconds: 3
            failureThreshold: 20
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555
