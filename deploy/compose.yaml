# Branch `microservices` (ADR 027): own project, own host ports (main's +10000), own image tag, so
# this stack runs next to `main`'s `program-capacity` stack. Every host port is an env variable.
name: program-capacity-ms

x-service-env: &service-env
  DATABASE_URL: postgres://capacity:capacity@postgres:5432/capacity
  KAFKA_BROKERS: kafka:9092
  OAUTH_ISSUER: http://localhost:${HOST_PORT_OAUTH:-18081}/default
  OAUTH_AUDIENCE: capacity-service
  OAUTH_JWKS_URL: http://oauth:8080/default/jwks
  LOG_LEVEL: info
  # NFR-10: `make up-all` (OTEL_ENABLED=true, profile observability) sends traces to Jaeger.
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}

x-service: &service
  build:
    context: ..
    dockerfile: Dockerfile
  image: program-capacity-service:ms-local
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    kafka-init:
      condition: service_completed_successfully
    oauth:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:9464/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 5s

# Funding (ADR 023, 025): its own images and its own database. Environment names are the ones the
# services read (src/config.ts, src/worker-config.ts) and the Helm chart sets.
x-funding-env: &funding-env
  DATABASE_URL: postgres://funding:funding@postgres:5432/funding
  OPS_PORT: 9464

x-funding: &funding
  image: funding-service:ms-local
  build:
    context: ..
    dockerfile: services/funding/Dockerfile
  restart: unless-stopped

services:
  postgres:
    image: postgres:18
    environment:
      # Bootstrap role only; init-databases.sh creates the capacity and funding roles (ADR 023).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports:
      - '${HOST_PORT_POSTGRES:-15432}:5432'
    healthcheck:
      # TCP, not the Unix socket: the entrypoint's temporary server has no TCP listener, so the check
      # cannot pass before init-databases.sh has created the roles.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U funding -d funding']
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:${HOST_PORT_KAFKA:-39092},CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${HOST_PORT_KAFKA:-39092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    ports:
      - '${HOST_PORT_KAFKA:-39092}:${HOST_PORT_KAFKA:-39092}'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1',
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  kafka-init:
    image: apache/kafka:4.2.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: 'no'
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        set -euo pipefail
        for topic in treasury.capacity.v1 treasury.fx-rates.v1 capacity.events.v1; do
          for name in "$$topic" "$$topic.dlq"; do
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
              --topic "$$name" --partitions 6 --replication-factor 1
          done
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  oauth:
    image: ghcr.io/navikt/mock-oauth2-server:3.0.1
    environment:
      JSON_CONFIG_PATH: /config/config.json
    volumes:
      - ./oauth:/config:ro
    ports:
      - '${HOST_PORT_OAUTH:-18081}:8080'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://localhost:8080/default/.well-known/openid-configuration',
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  migrate:
    <<: *service
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    command: ['node', 'src/capacity/adapters/out/postgres/migrate.js']
    environment:
      <<: *service-env

  api:
    <<: *service
    environment:
      <<: *service-env
      APP_ROLE: api
      HTTP_PORT: 3000
      # Internal gRPC (ADR 024): JWT on every call; published on the branch-only host port 60051.
      GRPC_PORT: 50051
      OPS_PORT: 9464
      # Swagger UI on the ops port calls the API from the browser (local development only).
      CORS_ORIGINS: http://localhost:${HOST_PORT_API_OPS:-19464},http://127.0.0.1:${HOST_PORT_API_OPS:-19464}
      OAUTH_TOKEN_URL: http://localhost:${HOST_PORT_OAUTH:-18081}/default/token
    ports:
      - '${HOST_PORT_API:-13000}:3000'
      - '127.0.0.1:${HOST_PORT_API_GRPC:-60051}:50051'
      - '${HOST_PORT_API_OPS:-19464}:9464'

  worker:
    <<: *service
    environment:
      <<: *service-env
      APP_ROLE: worker
      OPS_PORT: 9464
    ports:
      - '${HOST_PORT_WORKER_OPS:-19465}:9464'

  # --- funding: payment rail mock, migrations, API and saga worker (lane 0006 T14) -------------
  payments:
    image: payments-mock:ms-local
    build:
      context: ..
      dockerfile: services/payments-mock/Dockerfile
    restart: unless-stopped
    environment:
      PAYMENTS_PORT: 3200
      PAYMENTS_OPS_PORT: 9466
    ports:
      - '${HOST_PORT_PAYMENTS:-13200}:3200'

  funding-migrate:
    <<: *funding
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    command: ['node', 'src/funding/adapters/out/postgres/migrate.js']
    environment:
      DATABASE_URL: postgres://funding:funding@postgres:5432/funding

  funding-api:
    <<: *funding
    depends_on:
      funding-migrate:
        condition: service_completed_successfully
      oauth:
        condition: service_healthy
    environment:
      <<: *funding-env
      HTTP_PORT: 3100
      # Tokens carry the issuer the mock derives from the request host (ADR 027).
      OAUTH_ISSUER: http://localhost:${HOST_PORT_OAUTH:-18081}/default
      OAUTH_AUDIENCE: funding-service
      OAUTH_JWKS_URL: http://oauth:8080/default/jwks
    ports:
      - '${HOST_PORT_FUNDING:-13100}:3100'
      - '${HOST_PORT_FUNDING_OPS:-19466}:9464'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9464/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  funding-worker:
    <<: *funding
    command: ['node', 'src/worker.js']
    depends_on:
      funding-migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      payments:
        condition: service_started
    environment:
      <<: *funding-env
      CAPACITY_GRPC_TARGET: api:50051
      OAUTH_TOKEN_URL: http://oauth:8080/default/token
      # mock-oauth2-server derives `iss` from the request host: send the host the services trust.
      OAUTH_ISSUER_HOST: localhost:${HOST_PORT_OAUTH:-18081}
      PAYMENTS_BASE_URL: http://payments:3200
      FUNDING_RESERVE_DEADLINE: ${FUNDING_RESERVE_DEADLINE:-2m}
      FUNDING_DISBURSE_DEADLINE: ${FUNDING_DISBURSE_DEADLINE:-15m}
      FUNDING_PAYMENT_TIMEOUT_MS: ${FUNDING_PAYMENT_TIMEOUT_MS:-5000}
    ports:
      - '${HOST_PORT_FUNDING_WORKER_OPS:-19467}:9464'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9464/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # --- observability profile (NFR-10): Prometheus, Grafana, Jaeger, Kafka UI --------------------
  # `make up-all` starts the stack with all of them and tracing on.
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
    ports:
      - '${HOST_PORT_PROMETHEUS:-19090}:9090'

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.1.0
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/capacity.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '${HOST_PORT_GRAFANA:-13001}:3000'

  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:1.71.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '${HOST_PORT_JAEGER:-26686}:16686'
      - '${HOST_PORT_OTLP:-14318}:4318'

  # Kafka UI (http://localhost:${HOST_PORT_KAFKA_UI:-18080} on this branch): topics, records with headers, consumer groups and lag.
  # Local development only: no login, and it can produce records.
  kafka-ui:
    profiles: [observability]
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_CLUSTERS_0_NAME: program-capacity
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'false'
    ports:
      - '${HOST_PORT_KAFKA_UI:-18080}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:8080/actuator/health']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
