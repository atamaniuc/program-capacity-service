name: program-capacity

x-service-env: &service-env
  DATABASE_URL: postgres://capacity:capacity@postgres:5432/capacity
  KAFKA_BROKERS: kafka:9092
  OAUTH_ISSUER: http://localhost:8081/default
  OAUTH_AUDIENCE: capacity-service
  OAUTH_JWKS_URL: http://oauth:8080/default/jwks
  LOG_LEVEL: info
  # NFR-10: `OTEL_ENABLED=true docker compose --profile observability up -d` sends traces to Jaeger.
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}

x-service: &service
  build:
    context: ..
    dockerfile: Dockerfile
  image: program-capacity-service:local
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    kafka-init:
      condition: service_completed_successfully
    oauth:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:9464/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 5s

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: capacity
      POSTGRES_PASSWORD: capacity
      POSTGRES_DB: capacity
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U capacity -d capacity']
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    ports:
      - '29092:29092'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1',
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  kafka-init:
    image: apache/kafka:4.2.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: 'no'
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        set -euo pipefail
        for topic in treasury.capacity.v1 treasury.fx-rates.v1 capacity.events.v1; do
          for name in "$$topic" "$$topic.dlq"; do
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
              --topic "$$name" --partitions 6 --replication-factor 1
          done
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list

  oauth:
    image: ghcr.io/navikt/mock-oauth2-server:3.0.1
    environment:
      JSON_CONFIG_PATH: /config/config.json
    volumes:
      - ./oauth:/config:ro
    ports:
      - '8081:8080'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://localhost:8080/default/.well-known/openid-configuration',
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  migrate:
    <<: *service
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    command: ['node', 'src/capacity/adapters/out/postgres/migrate.js']
    environment:
      <<: *service-env

  api:
    <<: *service
    environment:
      <<: *service-env
      APP_ROLE: api
      HTTP_PORT: 3000
      OPS_PORT: 9464
    ports:
      - '3000:3000'
      - '9464:9464'

  worker:
    <<: *service
    environment:
      <<: *service-env
      APP_ROLE: worker
      OPS_PORT: 9464
    ports:
      - '9465:9464'

  # --- observability profile (NFR-10): Prometheus, Grafana, Jaeger -----------------------------
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
    ports:
      - '9090:9090'

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.1.0
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/capacity.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3001:3000'

  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:1.71.0
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'
      - '4318:4318'
