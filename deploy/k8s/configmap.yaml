apiVersion: v1
kind: ConfigMap
metadata:
  name: capacity-env
  namespace: capacity
data:
  DATABASE_URL: postgres://capacity:capacity@postgres:5432/capacity
  KAFKA_BROKERS: kafka:9092
  OAUTH_ISSUER: http://oauth:8080/default
  OAUTH_AUDIENCE: capacity-service
  OAUTH_JWKS_URL: http://oauth:8080/default/jwks
  OPS_PORT: '9464'
