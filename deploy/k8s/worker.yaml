apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: capacity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      # NFR-07: above the 25 s application shutdown deadline, so SIGKILL never cuts a drain.
      terminationGracePeriodSeconds: 40
      containers:
        - name: worker
          image: program-capacity-service:local
          envFrom:
            - configMapRef:
                name: capacity-env
            - secretRef:
                name: capacity-database
          env:
            - name: APP_ROLE
              value: worker
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          ports:
            - containerPort: 9464
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9464
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9464
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
