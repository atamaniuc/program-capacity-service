version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-all:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-all:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The service runs on the Node.js LTS line (engines, .nvmrc). A major Node.js upgrade is a
    # deliberate change, not a weekly bump, and odd majors never become LTS.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    groups:
      docker-all:
        patterns: ['*']
