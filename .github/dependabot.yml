version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-all:
        patterns: ['*']
    # @types/node follows the runtime major (Node.js 24); newer majors type APIs it lacks.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Nest CLI 12 pins TypeScript 6 (PRD §10); TypeScript 7 waits for a Nest release that allows it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-all:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The service runs on the Node.js LTS line (engines, .nvmrc). A major Node.js upgrade is a
    # deliberate change, not a weekly bump, and odd majors never become LTS.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    groups:
      docker-all:
        patterns: ['*']
