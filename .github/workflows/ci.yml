name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The compatibility check compares contracts/ with the base commit.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Harness gates
        run: npx harnessimo check
      - name: Lint
        run: npm run lint
      - name: lint in every workspace
        run: npm run lint --workspaces --if-present
      - name: Typecheck
        run: npm run typecheck
      - name: typecheck in every workspace
        run: npm run typecheck --workspaces --if-present
      - name: Layer rules
        run: npm run depcruise
      - name: depcruise in every workspace
        run: npm run depcruise --workspaces --if-present
      - name: OpenAPI, AsyncAPI and JSON Schema contracts match the zod schemas
        run: npm run contracts:check
      - name: No breaking change to the contracts (oasdiff, message schemas)
        run: npm run contracts:compat -- --base "$BASE" --require-oasdiff
        env:
          # A pull request is compared with its target branch, a push with what it replaced (ADR 024).
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      - name: Event schemas stay backward compatible (CT-04)
        run: npm run schema:compat
        env:
          SCHEMA_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      - name: Proto lint
        run: npm run proto:lint
      - name: Proto breaking changes against the PR base or the previous head
        run: npm run proto:breaking
        env:
          PROTO_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      - name: Proto stubs match a fresh generate
        run: npm run proto:check
      - name: Unit and property tests with coverage gate
        run: npm run test:unit
      - name: test:unit in every workspace
        run: npm run test:unit --workspaces --if-present

  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned: this helm version passes make helm-check locally (checked 2026-10-31).
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.22.1
      # make helm-check downloads kubeconform at its pinned version into .tools/ and checks the
      # SHA-256 of the archive.
      - name: Helm lint, template and kubeconform for every chart
        run: make helm-check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Integration and e2e tests (Testcontainers)
        run: npm run test:int
      - name: test:int in every workspace
        run: npm run test:int --workspaces --if-present

  image:
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t program-capacity-service:ci .
      - name: Build the funding-service image
        run: docker build -f services/funding/Dockerfile -t funding-service:ci .
      - name: Build the payments-mock image
        run: docker build -f services/payments-mock/Dockerfile -t payments-mock:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: program-capacity-service:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Trivy lockfile scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: package-lock.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Branch `microservices` only (ADR 026): the same make targets as locally. The cluster comes from
  # make kind-up (deploy/kind/cluster.yaml, no host port mappings, kubeconfig in .kind/), so the
  # kind action only installs kind and kubectl.
  kind:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/microservices') ||
      (github.event_name == 'pull_request' && github.base_ref == 'microservices')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # make kind-seed runs the capacity seed script against the cluster's database.
      - run: npm ci
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.22.1
      # kind v0.33.0 is what the local runs used; kubectl is within one minor of the node image
      # (v1.35.8 in deploy/kind/cluster.yaml).
      - uses: helm/kind-action@v1.15.1
        with:
          install_only: true
          version: v0.33.0
          kubectl_version: v1.35.8
      - name: Cluster, images and releases
        run: make kind-up
      - name: In-cluster smoke (capacity, funding saga, gateway)
        run: make kind-smoke
      - name: Collect cluster state
        if: failure()
        run: |
          mkdir -p kind-logs
          K="kubectl --kubeconfig .kind/kubeconfig --context kind-finverity-ms"
          $K get pods,svc,events -A -o wide > kind-logs/overview.txt || true
          $K get events -A --sort-by=.lastTimestamp > kind-logs/events.txt || true
          $K describe pods -A > kind-logs/describe.txt || true
          for ns in finverity-ms envoy-gateway-system; do
            for pod in $($K --namespace "$ns" get pods -o name); do
              $K --namespace "$ns" logs --all-containers --tail=500 "$pod" > "kind-logs/${ns}_${pod#pod/}.log" || true
            done
          done
      - name: Upload cluster state
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kind-logs
          path: kind-logs
          if-no-files-found: ignore
