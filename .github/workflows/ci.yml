name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The compatibility check compares contracts/ with the base commit.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Harness gates
        run: npx harnessimo check
      - name: Lint
        run: npm run lint
      - name: lint in every workspace
        run: npm run lint --workspaces --if-present
      - name: Typecheck
        run: npm run typecheck
      - name: typecheck in every workspace
        run: npm run typecheck --workspaces --if-present
      - name: Layer rules
        run: npm run depcruise
      - name: depcruise in every workspace
        run: npm run depcruise --workspaces --if-present
      - name: OpenAPI, AsyncAPI and JSON Schema contracts match the zod schemas
        run: npm run contracts:check
      - name: No breaking change to the contracts (oasdiff, message schemas)
        run: npm run contracts:compat -- --base "$BASE" --require-oasdiff
        env:
          # A pull request is compared with its target branch, a push with what it replaced (ADR 024).
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      - name: Event schemas stay backward compatible (CT-04)
        run: npm run schema:compat
        env:
          SCHEMA_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      - name: Proto lint
        run: npm run proto:lint
      - name: Proto breaking changes against the PR base or the previous head
        run: npm run proto:breaking
        env:
          PROTO_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      - name: Proto stubs match a fresh generate
        run: npm run proto:check
      - name: Unit and property tests with coverage gate
        run: npm run test:unit
      - name: test:unit in every workspace
        run: npm run test:unit --workspaces --if-present

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Integration and e2e tests (Testcontainers)
        run: npm run test:int
      - name: test:int in every workspace
        run: npm run test:int --workspaces --if-present

  image:
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t program-capacity-service:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: program-capacity-service:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Trivy lockfile scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: package-lock.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
